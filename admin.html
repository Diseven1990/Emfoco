<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração · Em Foco</title><style>
:root{font-family:Arial,sans-serif;color:#25282b;background:#f6f7f8}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:35px auto;padding:0 18px 60px}h1{font-size:26px;margin:0 0 22px}h2{font-size:19px}section{background:white;border:1px solid #e2e4e6;border-radius:10px;padding:25px;margin-bottom:20px}label{display:block;font-weight:600;margin:15px 0 7px}input,textarea{display:block;width:100%;padding:12px;border:1px solid #c9cdd0;border-radius:6px;font:inherit;background:white}textarea{resize:vertical;min-height:95px}#conteudo{min-height:210px}button{cursor:pointer;padding:11px 16px;border:0;border-radius:6px;font:inherit;font-weight:bold}button.primary{background:#f87823;color:white}button.secondary{background:#e9eaec;color:#25282b}button.danger{background:#fbe9e7;color:#a32619}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.list{display:grid;gap:10px}.item{border:1px solid #e2e4e6;border-radius:7px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:14px}.item strong{display:block}.item small{color:#777}.metrics{display:block;color:#a65a23;font-size:13px;margin-top:5px}.item .actions{margin:0}#message{min-height:24px;color:#575b60}.hidden{display:none}.auth{max-width:420px;margin:10vh auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}header h1{margin:0}img.preview{width:180px;max-width:100%;margin-top:10px;border-radius:5px}.hint{color:#777;font-size:13px}a{color:#be5417}@media(max-width:600px){main{margin:15px auto}section{padding:17px}.item{display:block}.item .actions{margin-top:12px}}
</style></head><body><main><section id="login" class="auth"><h1>Acesso à administração</h1><form id="loginForm"><label for="email">Email</label><input id="email" type="email" required autocomplete="username"><label for="password">Palavra-passe</label><input id="password" type="password" required autocomplete="current-password"><div class="actions"><button class="primary" type="submit">Entrar</button></div></form></section><div id="panel" class="hidden"><header><h1>Gestão de notícias</h1><button class="secondary" id="logout">Sair</button></header><section><h2 id="formTitle">Nova notícia</h2><form id="newsForm"><label for="titulo">Título</label><input id="titulo" required maxlength="250"><label for="descricao">Pré-visualização automática</label><textarea id="descricao" readonly></textarea><p class="hint">Gerada a partir do primeiro parágrafo, ou dos dois primeiros se o inicial for curto.</p><label for="conteudo">Notícia completa</label><textarea id="conteudo" required></textarea><label for="link_url">Link da notícia completa (opcional)</label><input id="link_url" type="url" placeholder="https://..." inputmode="url"><label for="imagem">Imagem de destaque</label><input id="imagem" type="file" accept="image/jpeg,image/png,image/webp"><p class="hint">JPG, PNG ou WebP. Máximo: 5 MB.</p><img id="preview" class="preview hidden" alt="Pré-visualização da imagem"><label><input id="publicado" type="checkbox" style="display:inline;width:auto"> Publicar notícia</label><div class="actions"><button class="primary" id="save" type="submit">Guardar notícia</button><button class="secondary hidden" id="cancel" type="button">Cancelar edição</button></div></form></section><section><h2>Notícias</h2><div id="newsList" class="list"></div></section></div><p id="message" role="status" aria-live="polite"></p></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://rhtghecodmeqagfcnebi.supabase.co','sb_publishable_wAJnOfdR_6KLcwX9511dPw_CxGz_HNu');
const $=s=>document.querySelector(s);let rows=[],editing=null,originalImage=null,metrics={};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const parags=text=>String(text||'').trim().split(/\n\s*\n|\n/).map(x=>x.trim()).filter(Boolean);
const excerpt=text=>{const p=parags(text);return p[0]&&p[0].length<180&&p[1]?p[0]+' '+p[1]:p[0]||''};
$('#conteudo').addEventListener('input',()=>{$('#descricao').value=excerpt($('#conteudo').value)});
const message=t=>$('#message').textContent=t;
async function isAdmin(){const {data,error}=await sb.rpc('eh_admin');if(error)console.error(error);return !error&&data===true}
async function state(){const {data:{session}}=await sb.auth.getSession();const ok=!!session&&await isAdmin();$('#login').classList.toggle('hidden',ok);$('#panel').classList.toggle('hidden',!ok);if(ok)await load();else if(session)message('Esta conta não tem permissões de administração.')}
$('#loginForm').onsubmit=async e=>{e.preventDefault();message('A autenticar…');const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){message('Não foi possível iniciar sessão. Verifica os dados.');return}message('');await state()};
$('#logout').onclick=async()=>{await sb.auth.signOut();reset();message('Sessão terminada.');await state()};
async function load(){const {data,error}=await sb.from('noticias').select('*').order('criado_em',{ascending:false});if(error){message('Erro ao carregar notícias: '+error.message);return}rows=data||[];const stats=await sb.rpc('metricas_noticias');if(!stats.error)metrics=Object.fromEntries((stats.data||[]).map(m=>[m.noticia_id,m]));else console.error(stats.error);$('#newsList').innerHTML=rows.length?rows.map(n=>'<div class="item"><div><strong>'+escapeHtml(n.titulo)+'</strong><small>'+(n.publicado?'Publicada':'Rascunho')+'</small><span class="metrics">🍯 '+(metrics[n.id]?.gostos??0)+' gostos · '+(metrics[n.id]?.visualizacoes??0)+' visualizações</span></div><div class="actions"><button class="secondary" type="button" data-edit="'+escapeHtml(n.id)+'">Editar</button><button class="danger" type="button" data-delete="'+escapeHtml(n.id)+'">Eliminar</button></div></div>').join(''):'<p>Ainda não existem notícias.</p>';$('#newsList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));$('#newsList').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete))}
function reset(){$('#newsForm').reset();editing=null;originalImage=null;$('#formTitle').textContent='Nova notícia';$('#cancel').classList.add('hidden');$('#preview').classList.add('hidden');$('#preview').removeAttribute('src')}
function edit(id){const n=rows.find(x=>x.id===id);if(!n)return;editing=id;originalImage=n.imagem_url;$('#titulo').value=n.titulo;$('#descricao').value=excerpt(n.conteudo);$('#link_url').value=n.link_url||'';$('#conteudo').value=n.conteudo;$('#publicado').checked=n.publicado;$('#formTitle').textContent='Editar notícia';$('#cancel').classList.remove('hidden');if(n.imagem_url){$('#preview').src=n.imagem_url;$('#preview').classList.remove('hidden')}else $('#preview').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
$('#cancel').onclick=reset;
$('#imagem').onchange=()=>{const f=$('#imagem').files[0];if(f){$('#preview').src=URL.createObjectURL(f);$('#preview').classList.remove('hidden')}};
$('#newsForm').onsubmit=async e=>{e.preventDefault();const button=$('#save');button.disabled=true;message('A guardar…');try{let image=originalImage;const file=$('#imagem').files[0];if(file){if(file.size>5*1024*1024)throw new Error('A imagem não pode ultrapassar 5 MB.');const ext=file.name.split('.').pop().toLowerCase();if(!['jpg','jpeg','png','webp'].includes(ext))throw new Error('Formato de imagem não permitido.');const path=crypto.randomUUID()+'.'+ext;const {error:uploadError}=await sb.storage.from('imagens-noticias').upload(path,file,{contentType:file.type,upsert:false});if(uploadError)throw uploadError;image=sb.storage.from('imagens-noticias').getPublicUrl(path).data.publicUrl}
const payload={titulo:$('#titulo').value.trim(),descricao:excerpt($('#conteudo').value),conteudo:$('#conteudo').value.trim(),imagem_url:image,link_url:$('#link_url').value.trim()||null,publicado:$('#publicado').checked,atualizado_em:new Date().toISOString()};if(!payload.titulo||!payload.descricao||!payload.conteudo)throw new Error('Preenche todos os campos.');
const res=editing?await sb.from('noticias').update(payload).eq('id',editing):await sb.from('noticias').insert(payload);if(res.error)throw res.error;reset();await load();message('Notícia guardada com sucesso.')}catch(err){message('Erro: '+err.message)}finally{button.disabled=false}};
async function remove(id){if(!confirm('Eliminar definitivamente esta notícia?'))return;const {error}=await sb.from('noticias').delete().eq('id',id);if(error)message('Erro: '+error.message);else{if(editing===id)reset();await load();message('Notícia eliminada.')}}
state();
</script></body></html>
