<!doctype html>
<html lang="pt-PT"><!-- emfoco-build:2026-10-28-editorial-2 --><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Em Foco</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#25282b;background:#fff}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}main{max-width:950px;margin:auto;padding:24px clamp(16px,4vw,44px) 75px}.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:42px 25px}.story{padding:0;margin:0;align-self:start;border:0;background:none;text-align:left;color:inherit;display:block;width:100%;height:auto;min-height:0;vertical-align:top}.story:focus-visible,.close:focus-visible{outline:3px solid #f87823;outline-offset:5px}.photo{width:100%;aspect-ratio:16/10;object-fit:cover;background:#f1f2f2;display:block;border-radius:2px}.story h2{hyphens:auto;text-align:justify;text-align-last:left;font-size:clamp(21px,2.4vw,29px);line-height:1.16;letter-spacing:-.035em;margin:13px 0 8px}.story p{text-align:justify;hyphens:auto;font-size:15px;line-height:1.55;color:#666;margin:0}.story:hover h2{color:#df651b}.accent{display:block;width:40px;height:4px;background:#f87823;margin:14px 0 0}.article{max-width:760px;margin:0 auto}.article .photo{aspect-ratio:16/9}.article h1{text-align:justify;text-align-last:left;hyphens:auto;font-size:clamp(30px,5vw,52px);line-height:1.09;letter-spacing:-.04em;margin:24px 0 16px}.article .lead{font-size:clamp(17px,2vw,21px);line-height:1.5;color:#555;margin:0 0 28px}.body{font-size:17px;line-height:1.85;text-align:justify;hyphens:auto;overflow-wrap:anywhere}.body p{margin:0 0 1.2em}.source{margin:28px 0 0;font-size:15px}.source a{color:#c55a15;text-decoration:underline;overflow-wrap:anywhere}.close{position:sticky;top:12px;float:right;margin:0 0 10px 10px;border:0;border-radius:50%;background:#25282b;color:white;width:44px;height:44px;font-size:26px;line-height:1;z-index:2}.message{color:#777;text-align:center;padding:90px 15px;font-size:16px}.error{color:#b43620}footer{display:none}@media(max-width:767px){html:has(.feed){scroll-snap-type:y mandatory;scroll-padding-top:0}main{padding:0 15px 35px}.feed{grid-template-columns:1fr;gap:0;align-items:start}.story{min-height:100svh;padding:16px 0 30px;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:flex-start}.story h2{font-size:27px}.story p{font-size:16px}.article{padding-top:14px}.article h1{margin-top:18px}.close{top:8px}}@media(prefers-reduced-motion:no-preference){.story .photo{transition:filter .2s}.story:hover .photo{filter:brightness(.96)}}
</style></head><body><main id="app"><p class="message">A carregar notícias…</p></main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://rhtghecodmeqagfcnebi.supabase.co','sb_publishable_wAJnOfdR_6KLcwX9511dPw_CxGz_HNu');

// Verifica periodicamente se o GitHub publicou uma versão mais recente do HTML.
// O parâmetro único evita reutilizar a cópia em cache do navegador.
const BUILD_ID='2026-10-28-editorial-2';
async function verificarVersao(){
  if(document.hidden)return;
  try{
    const url=new URL(window.location.href);
    url.searchParams.set('_emfoco_check',String(Date.now()));
    const response=await fetch(url.toString(),{cache:'no-store'});
    if(!response.ok)return;
    const html=await response.text();
    const novaVersao=html.match(/emfoco-build:([\w-]+)/)?.[1];
    if(novaVersao&&novaVersao!==BUILD_ID){
      const destino=new URL(window.location.href);
      destino.searchParams.set('_emfoco_v',novaVersao);
      window.location.replace(destino.toString());
    }
  }catch(error){console.debug('Verificação de versão indisponível',error)}
}
setInterval(verificarVersao,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)verificarVersao()});

const app=document.querySelector('#app');let stories=[];let scrollPosition=0;
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parags(text){return String(text||'').trim().split(/\n\s*\n|\n/).map(x=>x.trim()).filter(Boolean)}
function excerpt(text){const parts=parags(text);return parts[0]&&parts[0].length<180&&parts[1]?parts[0]+' '+parts[1]:parts[0]||''}
function safeUrl(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function photo(n){return n.imagem_url?'<img class="photo" loading="lazy" alt="" src="'+escapeHtml(n.imagem_url)+'">':'<div class="photo" aria-hidden="true"></div>'}
function feed(){app.innerHTML=stories.length?'<div class="feed">'+stories.map(n=>'<button class="story" data-id="'+escapeHtml(n.id)+'">'+photo(n)+'<h2>'+escapeHtml(n.titulo)+'</h2><p>'+escapeHtml(excerpt(n.conteudo))+'</p><span class="accent"></span></button>').join('')+'</div>':'<p class="message">Ainda não existem notícias publicadas.</p>';app.querySelectorAll('.story').forEach(el=>el.addEventListener('click',()=>openArticle(el.dataset.id)));requestAnimationFrame(()=>window.scrollTo(0,scrollPosition))}
function openArticle(id){const n=stories.find(x=>x.id===id);if(!n)return;scrollPosition=window.scrollY;const paragraphs=parags(n.conteudo).map(p=>'<p>'+escapeHtml(p)+'</p>').join('');const source=safeUrl(n.link_url);app.innerHTML='<article class="article"><button class="close" aria-label="Voltar às notícias" title="Voltar às notícias">×</button>'+photo(n)+'<h1>'+escapeHtml(n.titulo)+'</h1><div class="body">'+paragraphs+'</div>'+(source?'<p class="source"><a href="'+escapeHtml(source)+'" target="_blank" rel="noopener noreferrer">Consultar notícia completa ↗</a></p>':'')+'</article>';app.querySelector('.close').onclick=feed;window.scrollTo(0,0)}

const {data,error}=await sb.from('noticias').select('id,titulo,descricao,conteudo,imagem_url,criado_em,link_url').eq('publicado',true).order('criado_em',{ascending:false});
if(error){app.innerHTML='<p class="message error">Não foi possível carregar as notícias. Tenta novamente mais tarde.</p>';console.error(error)}else{stories=data||[];feed()}
</script></body></html>
