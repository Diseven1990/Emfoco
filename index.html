<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Em Foco</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#25282b;background:#fff}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}main{max-width:950px;margin:auto;padding:24px clamp(16px,4vw,44px) 75px}.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:42px 25px}.story{padding:0;border:0;background:none;text-align:left;color:inherit;display:block;width:100%}.story:focus-visible,.close:focus-visible{outline:3px solid #f87823;outline-offset:5px}.photo{width:100%;aspect-ratio:16/10;object-fit:cover;background:#f1f2f2;display:block;border-radius:2px}.story h2{font-size:clamp(21px,2.4vw,29px);line-height:1.16;letter-spacing:-.035em;margin:13px 0 8px}.story p{font-size:15px;line-height:1.55;color:#666;margin:0}.story:hover h2{color:#df651b}.accent{display:block;width:40px;height:4px;background:#f87823;margin:14px 0 0}.article{max-width:760px;margin:0 auto}.article .photo{aspect-ratio:16/9}.article h1{font-size:clamp(30px,5vw,52px);line-height:1.09;letter-spacing:-.04em;margin:24px 0 16px}.article .lead{font-size:clamp(17px,2vw,21px);line-height:1.5;color:#555;margin:0 0 28px}.body{font-size:17px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}.close{position:sticky;top:12px;float:right;margin:0 0 10px 10px;border:0;border-radius:50%;background:#25282b;color:white;width:44px;height:44px;font-size:26px;line-height:1;z-index:2}.message{color:#777;text-align:center;padding:90px 15px;font-size:16px}.error{color:#b43620}footer{display:none}@media(max-width:640px){main{padding:12px 15px 50px}.feed{grid-template-columns:1fr;gap:35px}.story h2{font-size:27px}.story p{font-size:16px}.article h1{margin-top:18px}.close{top:8px}}@media(prefers-reduced-motion:no-preference){.story .photo{transition:filter .2s}.story:hover .photo{filter:brightness(.96)}}
</style></head><body><main id="app"><p class="message">A carregar notícias…</p></main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://rhtghecodmeqagfcnebi.supabase.co','sb_publishable_wAJnOfdR_6KLcwX9511dPw_CxGz_HNu');
const app=document.querySelector('#app');let stories=[];let scrollPosition=0;
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function photo(n){return n.imagem_url?'<img class="photo" loading="lazy" alt="" src="'+escapeHtml(n.imagem_url)+'">':'<div class="photo" aria-hidden="true"></div>'}
function feed(){app.innerHTML=stories.length?'<div class="feed">'+stories.map(n=>'<button class="story" data-id="'+escapeHtml(n.id)+'">'+photo(n)+'<h2>'+escapeHtml(n.titulo)+'</h2><p>'+escapeHtml(n.descricao)+'</p><span class="accent"></span></button>').join('')+'</div>':'<p class="message">Ainda não existem notícias publicadas.</p>';app.querySelectorAll('.story').forEach(el=>el.addEventListener('click',()=>openArticle(el.dataset.id)));requestAnimationFrame(()=>window.scrollTo(0,scrollPosition))}
function openArticle(id){const n=stories.find(x=>x.id===id);if(!n)return;scrollPosition=window.scrollY;app.innerHTML='<article class="article"><button class="close" aria-label="Voltar às notícias" title="Voltar às notícias">×</button>'+photo(n)+'<h1>'+escapeHtml(n.titulo)+'</h1><p class="lead">'+escapeHtml(n.descricao)+'</p><div class="body">'+escapeHtml(n.conteudo)+'</div></article>';app.querySelector('.close').onclick=feed;window.scrollTo(0,0)}
const {data,error}=await sb.from('noticias').select('id,titulo,descricao,conteudo,imagem_url,criado_em').eq('publicado',true).order('criado_em',{ascending:false});
if(error){app.innerHTML='<p class="message error">Não foi possível carregar as notícias. Tenta novamente mais tarde.</p>';console.error(error)}else{stories=data||[];feed()}
</script></body></html>
